[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build-generated dist/_headers keeps previews out of search.
# Enable production indexing only during the approved domain launch:
# VITE_SITE_ORIGIN=https://ostkrieg.com and VITE_LAUNCH_READY=true.

[context.production.environment]
  VITE_SITE_ORIGIN = "https://ostkrieg.com"
  VITE_LAUNCH_READY = "true"

[context.deploy-preview.environment]
  VITE_SITE_ORIGIN = "https://ostkrieg.com"
  VITE_LAUNCH_READY = "false"

[context.branch-deploy.environment]
  VITE_SITE_ORIGIN = "https://ostkrieg.com"
  VITE_LAUNCH_READY = "false"
